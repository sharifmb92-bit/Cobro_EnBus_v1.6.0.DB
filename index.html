<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bus Pay Pro - Sharif v1.6.0</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
    <link rel="apple-touch-icon" href="./icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        :root { --primary: #007aff; --secondary: #34c759; --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --hint: #8e8e93; }
        body.dark { --bg: #000000; --card: #1c1c1e; --text: #ffffff; --hint: #8e8e93; }
        body.high-contrast { --bg: #ffffff; --card: #ffffff; --text: #000000; --hint: #000000; }
        
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); transition: 0.3s; }
        .card { background: var(--card); width: 100%; max-width: 450px; padding: 15px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); box-sizing: border-box; margin: 0 auto; position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .lang-bar { display: flex; gap: 5px; }
        .lang-btn { font-size: 18px; cursor: pointer; background: none; border: none; padding: 5px; }
        
        .header-actions { display: flex; gap: 6px; }
        .icon-btn { background: #e5e5ea; border: none; padding: 8px; border-radius: 50%; cursor: pointer; font-size: 14px; }
        body.dark .icon-btn { background: #3a3a3c; color: #fff; }

        input { width: 100%; padding: 12px; border: 1px solid #d1d1d6; border-radius: 12px; font-size: 18px; box-sizing: border-box; text-align: center; font-weight: bold; background: var(--card); color: var(--text); }
        
        .grid-cant { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
        .btn-cant { background: #e5e5ea; border: none; padding: 14px 0; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; color: #000; }
        .btn-cant.active { background: var(--primary); color: white; }

        .metodo-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        .btn-metodo { padding: 12px 6px; border: 2px solid #e5e5ea; border-radius: 12px; background: var(--card); font-weight: bold; font-size: 13px; cursor: pointer; color: var(--text); text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
        .btn-metodo.active { border-color: var(--primary); color: var(--primary); }

        .total-box { background: #000; color: white; padding: 12px; border-radius: 15px; text-align: center; margin-bottom: 10px; }
        .total-val { font-size: 30px; font-weight: 800; color: var(--secondary); }

        .qr-container { text-align: center; background: #fff; padding: 12px; border-radius: 15px; border: 2px solid transparent; }
        body.high-contrast .qr-container { border-color: #000000; background: #ffffff; }
        #qrcode { display: inline-block; padding: 5px; background: white; }

        .notice { font-size: 11px; color: var(--hint); margin-top: 10px; text-align: center; font-style: italic; }
        
        .history-section { margin-top: 15px; font-size: 12px; border-top: 1px solid #d1d1d6; padding-top: 10px; }
        .history-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #eee; }

        .pin-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); border-radius: 25px; z-index: 100; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .pin-overlay input { width: 140px; margin-top: 10px; font-size: 22px; letter-spacing: 5px; }
        .btn-action-sm { font-size: 10px; padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; background: var(--card); color: var(--text); cursor: pointer; }
    </style>
</head>
<body id="mainBody">

<div class="card">
    <div class="header">
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleNight()">🌙</button>
            <button class="icon-btn" onclick="toggleSunMode()">☀️</button>
            <button class="icon-btn" onclick="bloquearPantalla()">🔒</button>
        </div>
        <div class="lang-bar">
            <button class="lang-btn" onclick="setLang('es')">🇪🇸</button>
            <button class="lang-btn" onclick="setLang('en')">🇬🇧</button>
            <button class="lang-btn" onclick="setLang('fr')">🇫🇷</button>
            <button class="lang-btn" onclick="setLang('de')">🇩🇪</button>
            <button class="lang-btn" onclick="setLang('it')">🇮🇹</button>
        </div>
    </div>

    <label id="lblPrecio" style="font-size: 12px; font-weight: bold;">PRECIO BILLETE (€)</label>
    <input type="number" id="precio" value="5.75" step="0.05" oninput="calcular()">

    <div class="grid-cant" id="cantGrid">
        <!-- Generado por JS -->
    </div>

    <div class="metodo-selector">
        <button id="btnPayDirect" class="btn-metodo active" onclick="setMetodo('paypal_web')">
            <span>Pago Web Directo 💳</span>
            <span style="font-size: 9px; opacity: 0.8; color: var(--secondary);">Sin descargar Apps (GPay/ApplePay/Tarjeta)</span>
        </button>
        <button id="btnRev" class="btn-metodo" onclick="setMetodo('revolut')">
            <span>Revolut App</span>
            <span style="font-size: 9px; opacity: 0.8;">Para usuarios de Revolut</span>
        </button>
    </div>

    <div class="total-box">
        <span class="total-val" id="displayTotal">5.75€</span>
    </div>

    <div style="display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap;">
        <button class="btn-action-sm" onclick="vibrar(15); window.location.href='paypal://'" style="flex:1;">Check PayPal</button>
        <button class="btn-action-sm" onclick="vibrar(15); window.location.href='revolut://'" style="flex:1;">Check Revolut</button>
        <button class="btn-action-sm" onclick="exportarCaja()" style="flex:1;">Exportar Caja</button>
        <button class="btn-action-sm" onclick="vibrar(20); clearHistory()" style="border-color:#ff3b30; color:white; background:#ff3b30;">Borrar Caja</button>
    </div>

    <div class="qr-container">
        <div id="qrcode"></div>
        <p class="notice" id="txtCortesía">Este es un favor personal para ayudarle. Asegúrese de pedir su ticket físico.</p>
    </div>

    <div class="history-section">
        <strong>CAJA HOY: <span id="totalCaja">0.00€</span></strong>
        <div id="historyList"></div>
    </div>

    <div class="pin-overlay" id="pinOverlay">
        <h3>🔒 Aplicación Bloqueada</h3>
        <p style="font-size: 12px;">Introduce tu PIN para acceder</p>
        <input type="password" id="pinInput" maxlength="4" placeholder="••••">
        <button onclick="desbloquear()" style="margin-top: 15px; padding: 8px 20px; border-radius: 8px; border: none; background: var(--primary); color: white; font-weight: bold;">Acceder</button>
    </div>
</div>

<script>
    const USUARIO_REVOLUT = "sharifmb"; 
    const USUARIO_PAYPAL = "Sherrif86";
    const PIN_SEGURIDAD = "1234";
    
    let cantidadActual = 1;
    let metodoActual = 'paypal_web';
    let langActual = 'es';
    let db;

    const i18n = {
        es: { precio: "PRECIO BILLETE (€)", aviso: "Este es un favor personal del conductor para facilitar su viaje. Por favor, asegúrese de recibir su ticket físico.", voz: "Total a cobrar: " },
        en: { precio: "TICKET PRICE (€)", aviso: "This is a personal favor to assist your travel. Please ensure you receive your physical ticket.", voz: "Total amount: " },
        fr: { precio: "PRIX DU BILLET (€)", aviso: "C'est une faveur personnelle du conducteur. Assurez-vous de recevoir votre ticket physique.", voz: "Total à payer: " },
        de: { precio: "TICKETPREIS (€)", aviso: "Dies ist ein persönlicher Gefallen des Fahrers. Bitte verlangen Sie Ihr physisches Ticket.", voz: "Gesamtbetrag: " },
        it: { precio: "PREZZO BIGLIETTO (€)", aviso: "Questo è un favore personale del conducente. Assicurati di ricevere il tuo biglietto fisico.", voz: "Totale da pagare: " }
    };

    function vibrar(duracion = 10) {
        if ('vibrate' in navigator) {
            navigator.vibrate(duracion);
        }
    }

    function initDB() {
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().then(granted => console.log("Storage persistente:", granted));
        }

        const request = indexedDB.open("BusPayProDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("history")) {
                db.createObjectStore("history", { keyPath: "id", autoIncrement: true });
            }
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            loadHistory();
        };
    }

    function init() {
        initDB();
        const grid = document.getElementById('cantGrid');
        for(let i=1; i<=10; i++) {
            grid.innerHTML += `<button class="btn-cant ${i===1?'active':''}" onclick="setCant(${i}, this)">${i}</button>`;
        }
        calcular(false);
    }

    function setLang(l) {
        vibrar(12);
        langActual = l;
        document.getElementById('lblPrecio').innerText = i18n[l].precio;
        document.getElementById('txtCortesía').innerText = i18n[l].aviso;
        calcular(true);
    }

    function toggleNight() { 
        vibrar(12);
        document.body.classList.remove('high-contrast');
        document.body.classList.toggle('dark'); 
    }

    function toggleSunMode() {
        vibrar(15);
        document.body.classList.remove('dark');
        document.body.classList.toggle('high-contrast');
    }

    function bloquearPantalla() {
        vibrar(20);
        document.getElementById('pinOverlay').style.display = 'flex';
    }

    function desbloquear() {
        const pin = document.getElementById('pinInput').value;
        if (pin === PIN_SEGURIDAD) {
            vibrar(10);
            document.getElementById('pinOverlay').style.display = 'none';
            document.getElementById('pinInput').value = '';
        } else {
            vibrar([50, 50, 50]);
            alert("PIN Incorrecto");
        }
    }

    function setCant(n, btn) {
        vibrar(10 + (n * 2));
        cantidadActual = n;
        document.querySelectorAll('.btn-cant').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        calcular(true);
    }

    function setMetodo(m) {
        vibrar(12);
        metodoActual = m;
        document.getElementById('btnPayDirect').classList.toggle('active', m === 'paypal_web');
        document.getElementById('btnRev').classList.toggle('active', m === 'revolut');
        calcular(true);
    }

    function hablar(texto) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(texto);
            msg.lang = langActual;
            window.speechSynthesis.speak(msg);
        }
    }

    function calcular(conVoz) {
        const precio = document.getElementById('precio').value || 0;
        const total = (precio * cantidadActual).toFixed(2);
        document.getElementById('displayTotal').innerText = total + "€";
        
        let url = "";
        if (metodoActual === "paypal_web") {
            url = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${USUARIO_PAYPAL}&amount=${total}&currency_code=EUR&no_shipping=1`;
        } else if (metodoActual === "revolut") {
            url = `https://revolut.me/${USUARIO_REVOLUT}/${total}`;
        }

        const qrDiv = document.getElementById("qrcode");
        qrDiv.innerHTML = "";
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        qrDiv.innerHTML = qr.createImgTag(5, 10);

        if(conVoz) {
            hablar(i18n[langActual].voz + total + " euros");
            saveTransaction(total);
        }
        // medbasha
    }

    function saveTransaction(total) {
        if (!db) return;
        const tx = db.transaction(["history"], "readwrite");
        const store = tx.objectStore("history");
        
        const item = { time: new Date().toLocaleTimeString(), amount: total };
        store.add(item);

        tx.oncomplete = () => { trimHistory(); };
    }

    function trimHistory() {
        if (!db) return;
        const tx = db.transaction(["history"], "readwrite");
        const store = tx.objectStore("history");
        
        const request = store.getAll();
        request.onsuccess = () => {
            let history = request.result;
            if (history.length > 10) {
                const itemsToDelete = history.length - 10;
                for (let i = 0; i < itemsToDelete; i++) {
                    store.delete(history[i].id);
                }
            }
            loadHistory();
        };
    }

    function loadHistory() {
        if (!db) return;
        const tx = db.transaction(["history"], "readonly");
        const store = tx.objectStore("history");
        const request = store.getAll();

        request.onsuccess = () => {
            let history = request.result.reverse();
            const list = document.getElementById('historyList');
            let totalDia = 0;
            list.innerHTML = history.map(item => {
                totalDia += parseFloat(item.amount);
                return `<div class="history-item"><span>${item.time}</span> <strong>${item.amount}€</strong></div>`;
            }).join('');
            document.getElementById('totalCaja').innerText = totalDia.toFixed(2) + "€";
        };
    }

    function exportarCaja() {
        vibrar(15);
        if (!db) return;
        const tx = db.transaction(["history"], "readonly");
        const store = tx.objectStore("history");
        const request = store.getAll();

        request.onsuccess = () => {
            let history = request.result;
            let totalDia = 0;
            let resumen = `RESUMEN CAJA HOY:\n`;
            history.forEach(item => {
                totalDia += parseFloat(item.amount);
                resumen += `${item.time} - ${item.amount}€\n`;
            });
            resumen += `TOTAL: ${totalDia.toFixed(2)}€`;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(resumen);
                alert("Resumen de la caja copiado al portapapeles:\n\n" + resumen);
            } else {
                alert(resumen);
            }
        };
    }

    function clearHistory() { 
        if(confirm("¿Borrar caja del día?")) {
            if (!db) return;
            const tx = db.transaction(["history"], "readwrite");
            const store = tx.objectStore("history");
            store.clear();
            tx.oncomplete = () => { loadHistory(); };
        }
    }

    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
    window.onload = init;
</script>
</body>
</html>
